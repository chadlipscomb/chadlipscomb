name: Metrics

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # METRICS_TOKEN: a personal access token with read access to your repos.
      # Classic PAT with `repo` + `read:user` includes private repos in the
      # language breakdown; `public_repo` + `read:user` keeps it public-only.
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_indepth: no
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, scss, dockerfile, makefile, cmake
          plugin_languages_skipped: Pake
